name: Build and Push Container Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Don't let one flaky variant cancel the others. Each variant is an
      # independent image, so a transient failure in (e.g.) the opencode build
      # shouldn't take down the otherwise-healthy base and dind builds.
      fail-fast: false
      matrix:
        include:
          - variant: base
            image_suffix: ""
          - variant: dind
            image_suffix: "-dind"
          - variant: opencode
            image_suffix: "-opencode"
          - variant: opencode-dind
            image_suffix: "-opencode-dind"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # Pin to the last-good QEMU. binfmt:latest ships QEMU v9, which has a
          # regression that makes apt segfault / fail ("Cannot allocate memory")
          # under arm64 emulation — this broke the multi-arch dind build.
          # See https://github.com/tonistiigi/binfmt/issues/245
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=pr

      # Build for local testing first (single platform)
      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          tags: claude-container:${{ matrix.variant }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test the JDK: every variant inherits Java from the base-common stage,
      # so this runs for all four and catches a broken JAVA_HOME symlink too.
      - name: Test Java installation
        run: |
          echo "=== Testing Java (${{ matrix.variant }}) ==="
          docker run --rm --entrypoint /bin/bash \
            -e SKIP_FIREWALL=1 \
            claude-container:${{ matrix.variant }}-test -c '
              set -e
              java -version
              javac -version
              test -x "${JAVA_HOME}/bin/java" || { echo "JAVA_HOME is not usable: ${JAVA_HOME}"; exit 1; }
              java -version 2>&1 | grep -q "openjdk version \"25" || { echo "expected Java 25"; exit 1; }
            '
          echo "PASS: Java 25 (Temurin) is installed and on PATH"

      # Test the firewall with a whitelist mounted read-only at /etc/claude-container.
      # Every "blocked" target would answer if the firewall let it through, so a
      # refused connection proves the rule works. Runs init-firewall.sh directly
      # (not via the entrypoint) so the check is isolated to the firewall itself.
      - name: Test firewall
        run: |
          echo "=== Testing firewall (${{ matrix.variant }}) ==="
          FW_DIR="${RUNNER_TEMP}/firewall-test"
          mkdir -p "${FW_DIR}"
          cat > "${FW_DIR}/allowed-domains.conf" <<'EOF'
          # Test whitelist
          dns.google          # stable IPs (api.github.com returns a different IP per lookup on CI runners)
          1.1.1.1:443         # single IP, port-restricted
          1.0.0.1             # single IP, all ports
          10.99.0.0/16        # subnet
          10.98.0.0/16:22
          not a domain
          2001:db8::1
          EOF
          docker run --rm --entrypoint /bin/bash \
            --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -v "${FW_DIR}:/etc/claude-container:ro" \
            claude-container:${{ matrix.variant }}-test -c '
              set -e
              fail() { echo "FAIL: $*"; exit 1; }

              out=$(sudo /usr/local/bin/init-firewall.sh) || { echo "$out"; fail "init-firewall.sh exited non-zero"; }
              echo "$out"

              echo "--- Config and parsing"
              grep -q "Loading allowed domains from: /etc/claude-container/allowed-domains.conf" <<< "$out" || fail "mounted config not used"
              grep -q "Skipping '\''10.98.0.0/16:22'\'': port restrictions are not supported for subnets" <<< "$out" || fail "subnet with port not rejected"
              grep -q "Skipping '\''not a domain'\''" <<< "$out" || fail "invalid line not skipped"
              grep -q "Skipping '\''2001:db8::1'\'': IPv6 entries are not supported" <<< "$out" || fail "IPv6 entry not skipped"
              sudo iptables -S OUTPUT | grep -q -- "-d 10.99.0.0/16 -j ACCEPT" || fail "subnet rule missing"

              echo "--- Self-check"
              grep -q "OK: non-whitelisted IP rejected" <<< "$out" || fail "self-check: non-whitelisted IP not rejected"
              grep -q "OK: whitelisted domain reachable" <<< "$out" || fail "self-check: whitelisted domain not reachable"

              echo "--- Reload is idempotent"
              before=$(sudo iptables -S OUTPUT | wc -l)
              sudo /usr/local/bin/init-firewall.sh > /dev/null
              after=$(sudo iptables -S OUTPUT | wc -l)
              [ "$before" = "$after" ] || fail "rule count changed on reload ($before -> $after)"

              echo "--- Allowed traffic"
              allowed() { curl -sS -o /dev/null --max-time 10 --retry 2 "$1" || fail "$1 should be allowed"; echo "OK: allowed $1"; }
              allowed https://dns.google
              allowed https://1.1.1.1
              allowed https://1.0.0.1
              allowed http://1.0.0.1

              echo "--- Blocked traffic (rejected locally, curl exit 7)"
              blocked() {
                rc=0; curl -sS -o /dev/null --max-time 10 "$1" 2>/dev/null || rc=$?
                [ "$rc" = 7 ] || fail "$1 should be rejected (curl exit $rc, expected 7)"
                echo "OK: rejected $1"
              }
              blocked http://1.1.1.1
              blocked https://9.9.9.9
              blocked https://example.com

              echo "--- IPv6"
              sudo ip6tables -S OUTPUT | grep -q -- "-P OUTPUT DROP" || fail "IPv6 OUTPUT policy is not DROP"
              sudo ip6tables -S OUTPUT | grep -q -- "-A OUTPUT -o lo -j ACCEPT" || fail "IPv6 loopback not allowed"
            '
          echo "PASS: firewall whitelist, port rules, REJECT and IPv6 block work"

      # Test Playwright (base + opencode share the playwright layer)
      - name: Test Playwright installation
        if: matrix.variant == 'base' || matrix.variant == 'opencode'
        run: |
          echo "=== Testing Playwright browsers (${{ matrix.variant }}) ==="
          docker run --rm --entrypoint /bin/bash claude-container:${{ matrix.variant }}-test -c "
            echo 'Checking browser directory ownership...'
            ls -la /opt/playwright-browsers/

            echo ''
            echo 'Testing lock file creation...'
            touch /opt/playwright-browsers/__dirlock
            rm /opt/playwright-browsers/__dirlock
            echo 'Lock file test passed'

            echo ''
            echo 'Testing Playwright browser launch...'
            node -e \"
              const { chromium } = require('playwright');
              (async () => {
                console.log('Launching browser...');
                const browser = await chromium.launch();
                console.log('Browser launched successfully');
                const page = await browser.newPage();
                await page.goto('https://example.com');
                const title = await page.title();
                console.log('Page title:', title);
                if (!title.includes('Example')) {
                  throw new Error('Unexpected page title');
                }
                await browser.close();
                console.log('Playwright test passed!');
              })();
            \"
          "

      # Test Vaadin Pro Key passthrough (base + opencode)
      - name: Test Vaadin Pro Key support
        if: matrix.variant == 'base' || matrix.variant == 'opencode'
        run: |
          echo "=== Testing VAADIN_PRO_KEY passthrough (${{ matrix.variant }}) ==="
          TEST_KEY="test-vaadin-pro-key-12345"

          # Test: env var is available inside the container
          echo "Test: VAADIN_PRO_KEY env var is accessible..."
          docker run --rm \
            -e VAADIN_PRO_KEY="${TEST_KEY}" \
            -e SKIP_FIREWALL=1 \
            claude-container:${{ matrix.variant }}-test \
            bash -c '[ "${VAADIN_PRO_KEY}" = "'"${TEST_KEY}"'" ]'
          echo "PASS: VAADIN_PRO_KEY env var is set correctly"

          echo "=== All Vaadin Pro Key tests passed ==="

      # Test OpenCode CLI is installed and runnable
      - name: Test OpenCode installation
        if: matrix.variant == 'opencode' || matrix.variant == 'opencode-dind'
        run: |
          echo "=== Testing OpenCode CLI (${{ matrix.variant }}) ==="
          docker run --rm --entrypoint /bin/bash \
            -e SKIP_FIREWALL=1 \
            claude-container:${{ matrix.variant }}-test -c "
              command -v opencode || { echo 'opencode not found on PATH'; exit 1; }
              opencode --version
            "
          echo "PASS: opencode CLI is installed"

      # Test the Docker daemon starts and works inside the DinD variants.
      # Bypasses the DinD entrypoint (which also inits the firewall) and starts
      # dockerd directly so the check is isolated to Docker itself.
      #
      # The daemon runs with the `vfs` storage driver via a throwaway config
      # file: the runner's own Docker storage is overlay2, and overlay cannot be
      # mounted on top of overlay ("failed to mount overlay: invalid argument"),
      # so the baked overlay2 daemon.json can't start nested here. vfs needs no
      # overlay support and exercises the same path — dockerd boots and the CLI
      # talks to it. The image keeps overlay2 for real hosts, which support it.
      - name: Test Docker-in-Docker daemon
        if: matrix.variant == 'dind' || matrix.variant == 'opencode-dind'
        run: |
          echo "=== Testing Docker-in-Docker daemon (${{ matrix.variant }}) ==="
          docker run --rm --privileged --entrypoint /bin/bash \
            -e SKIP_FIREWALL=1 \
            claude-container:${{ matrix.variant }}-test -c '
              set -e
              command -v docker || { echo "docker not found on PATH"; exit 1; }
              printf "{\"storage-driver\":\"vfs\"}" | sudo tee /tmp/daemon-vfs.json >/dev/null
              sudo dockerd --config-file=/tmp/daemon-vfs.json > /tmp/dockerd.log 2>&1 &
              echo "Waiting for dockerd..."
              for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
              docker info >/dev/null 2>&1 || { echo "dockerd failed to start"; cat /tmp/dockerd.log; exit 1; }
              docker version
            '
          echo "PASS: dockerd starts and responds"

      # Test the Playwright Agent CLI is installed, the skill is baked in, and it
      # can launch the pre-installed Chromium offline (no runtime browser download).
      - name: Test Playwright Agent CLI
        if: matrix.variant == 'base' || matrix.variant == 'opencode'
        run: |
          echo "=== Testing Playwright Agent CLI (${{ matrix.variant }}) ==="
          docker run --rm --entrypoint /bin/bash \
            -e SKIP_FIREWALL=1 \
            claude-container:${{ matrix.variant }}-test -c '
              set -e
              command -v playwright-cli || { echo "playwright-cli not found on PATH"; exit 1; }
              playwright-cli --version

              echo "Checking pre-installed skill..."
              test -f /home/node/.claude/skills/playwright-cli/SKILL.md \
                || { echo "skill SKILL.md not found"; exit 1; }

              echo "Launching pre-installed browser (offline data: URL)..."
              playwright-cli open
              playwright-cli goto "data:text/html,<h1>cli-ok</h1>"
              playwright-cli snapshot | grep -q "cli-ok" \
                || { echo "expected heading not found in snapshot"; exit 1; }
              playwright-cli close
            '
          echo "PASS: playwright-cli is installed, skill present, browser launches"

      # Build and push multi-platform images
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
